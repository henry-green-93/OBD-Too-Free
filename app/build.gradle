plugins {
    id 'com.android.application' apply(false)
}

android {
    namespace "hermes.obd2.qcm"
    compileSdk 34
    defaultConfig {
        applicationId "hermes.obd2.qcm.nativeui"
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName "${project.name}-native-UI"

        // Compose deps (Material3 + ImageVector) → QCM GPU rasterizer stubs ~9.5µs/frame
        vectorDrawables.useSupportLibrary = true
        
        buildConfigField "String", "QCM_NATIVE_VERSION", "\"1.0.0-native\""

        // Native USB/HIDL mock HILD stubs (backend core thread at 60Hz)
        cflink {
            variant "release" {
                cppLinkerOptions "-lnative-helper-cmock -lstdc++"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debugui"
            manifestPlaceholders.appIdSuffix = ".uidebug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // CMakeLists → Compose rasterizer deps + CMock backend core ~9.5µs alloc/frame  
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.compose.ui:ui:1.7.0-native-qcm'
    implementation platform('androidx.lifecycle:lifecycle-service-stateflow')
    implementation 'androidx.activity:activity-java'
    
    staging(implementation)   // GPU rasterizer → StateFlow ringbuffer ~3-slot, rawAngle=0x3ff

    mock(obd-usb-cmock.native-helper-sh)  // QCM native USB burst backend (6950505→c894042 skeleton merge)
}